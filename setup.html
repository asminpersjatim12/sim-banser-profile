<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Setup Admin | SIM BANSER JATIM</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; color: #1d2a38; background: linear-gradient(135deg,#111f35,#9f1d24); }
    .card { width: min(420px,calc(100% - 2rem)); padding: 2rem; border-radius: 1.2rem; background: #fff; }
    .card > p:first-child { color: #9f1d24; font-size: .75rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: .2rem 0 .75rem; font-family: Georgia,serif; }
    .muted { color: #667079; }
    label { display: block; margin-top: 1rem; font-size: .82rem; font-weight: 800; }
    input { width: 100%; margin-top: .45rem; padding: .8rem .9rem; border: 1px solid #ddd5c5; border-radius: .65rem; font: inherit; }
    button { width: 100%; margin-top: 1.25rem; padding: .85rem; border: 0; border-radius: .65rem; background: #111f35; color: #fff; font-weight: 900; cursor: pointer; }
  </style>
</head>
<body>
  <main class="card">
    <p>Konfigurasi pertama kali</p>
    <h1>Buat akun admin</h1>
    <p class="muted">Akun ini menjadi satu-satunya pintu masuk dashboard.</p>
    <form method="post" action="/setup-submit">
      <label for="username">Username</label>
      <input id="username" name="username" required minlength="3" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="12" autocomplete="new-password">
      <label for="password_confirmation">Konfirmasi password</label>
      <input id="password_confirmation" name="password_confirmation" type="password" required minlength="12" autocomplete="new-password">
      <button type="submit">Buat admin dan masuk</button>
    </form>
  </main>
</body>
</html>
